<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Ajouter un produit</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput [(ngModel)]="newProduct.name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Prix (DT)</mat-label>
        <input matInput type="number" [(ngModel)]="newProduct.price" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock</mat-label>
        <input matInput type="number" [(ngModel)]="newProduct.stock" />
      </mat-form-field>

      <button mat-flat-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon> Ajouter
      </button>
    </div>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Catalogue</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="products" class="full-width">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let p">{{ p.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let p">{{ p.name }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Prix</th>
        <td mat-cell *matCellDef="let p">{{ p.price | number: '1.2-2' }} DT</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let p">
          <span class="badge" [ngClass]="getStockClass(p.stock)">{{ p.stock }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
